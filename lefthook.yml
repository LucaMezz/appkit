pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{ts,tsx,js,jsx,json,css,md,mdx}"
      run: pnpm run check
      stage_fixed: true

    knip:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm run knip

pre-push:
  parallel: true
  commands:
    test:
      glob: "*.{ts,tsx}"
      run: pnpm run test:run

    package:
      glob: "*.{ts,tsx,css,md,mdx}"
      run: pnpm run package

    similarity:
      glob: "*.{ts,tsx}"
      run: similarity-ts ./src --threshold 0.9 --no-types --fail-on-duplicates && similarity-ts ./src --types-only --threshold 0.97 --fail-on-duplicates
