pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{ts,tsx,js,jsx,json,css,md,mdx}"
      run: npm run check
      stage_fixed: true
    knip:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx knip

pre-push:
  parallel: true
  commands:
    test:
      glob: "*.{ts,tsx}"
      run: npm run test:run
    build:
      glob: "*.{ts,tsx,css,md,mdx}"
      run: npm run build
    similarity:
      glob: "*.{ts,tsx}"
      run: /Users/kimizuy/.cargo/bin/similarity-ts ./src --threshold 0.9 --no-types --fail-on-duplicates && /Users/kimizuy/.cargo/bin/similarity-ts ./src --types-only --threshold 0.97 --fail-on-duplicates
